<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0a0e27">
  <meta name="robots" content="noindex">
  <meta name="description" content="This page has gone missing. We checked behind the servers. Return to Olster Studios.">
  <title>404 — Page Not Found | Olster Studios</title>
  <link rel="icon" type="image/png" href="/images/logo.png">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root{color-scheme:dark;--orange:#ff6b35;--cyan:#00d4ff;--text:#f0f0f0;--muted:#aeb5c4}
    *{box-sizing:border-box;margin:0;padding:0;font-family:Poppins,sans-serif}
    body{min-height:100vh;display:grid;place-items:center;padding:24px;color:var(--text);background:linear-gradient(135deg,#0a0e27,#1a1f3a 52%,#0f1729);overflow:hidden}
    body:before,body:after{content:"";position:fixed;width:360px;height:360px;border-radius:50%;filter:blur(90px);opacity:.16;pointer-events:none}
    body:before{background:var(--orange);top:-140px;left:-100px}body:after{background:var(--cyan);right:-130px;bottom:-150px}
    main{position:relative;z-index:1;width:min(100%,680px);text-align:center;padding:clamp(28px,6vw,60px);border:1px solid rgba(255,107,53,.22);border-radius:28px;background:rgba(10,14,39,.76);box-shadow:0 25px 90px rgba(0,0,0,.32);backdrop-filter:blur(14px)}
    .logo{width:78px;height:78px;object-fit:contain;margin-bottom:20px;filter:drop-shadow(0 0 18px rgba(255,107,53,.35))}
    .code{font-size:clamp(6rem,23vw,10rem);font-weight:800;line-height:.95;letter-spacing:-.07em;background:linear-gradient(120deg,var(--orange),var(--cyan));background-clip:text;-webkit-background-clip:text;color:transparent}
    h1{font-size:clamp(1.6rem,5vw,2.3rem);margin:22px 0 12px}
    p{color:var(--muted);line-height:1.8;font-size:1rem;max-width:470px;margin:0 auto}
    .actions{display:flex;justify-content:center;gap:12px;flex-wrap:wrap;margin-top:30px}
    a{display:inline-flex;align-items:center;justify-content:center;gap:10px;padding:13px 22px;border-radius:999px;text-decoration:none;font-weight:700;transition:transform .2s,box-shadow .2s}
    a:hover{transform:translateY(-3px)}
    .home{color:#fff;background:linear-gradient(135deg,var(--orange),#ff8c54);box-shadow:0 8px 24px rgba(255,107,53,.22)}
    .blog{color:var(--cyan);border:1px solid rgba(0,212,255,.4);background:rgba(0,212,255,.06)}
    .hint{font-size:.82rem;margin-top:28px;color:#7f899e}
    /* THE WHEEL OF DOOM — macOS-style spinning beach ball */
    #wheel-of-doom{display:none;position:fixed;left:0;top:0;width:34px;height:34px;border-radius:50%;pointer-events:none;z-index:2147483647;transform:translate(-50%,-50%);will-change:left,top,transform;overflow:hidden;border:1px solid rgba(255,255,255,.72);background:radial-gradient(ellipse at 28% 18%,rgba(255,255,255,.98) 0%,rgba(255,255,255,.55) 8%,rgba(255,255,255,0) 29%),conic-gradient(from -18deg,#f7f7f7 0deg 28deg,#f4a4b6 28deg 58deg,#ef3340 58deg 88deg,#f68b2d 88deg 118deg,#f5d64e 118deg 148deg,#8acb6b 148deg 178deg,#28b9a5 178deg 208deg,#4aa4e8 208deg 238deg,#6554c0 238deg 268deg,#a56ad6 268deg 298deg,#e65caa 298deg 328deg,#f7f7f7 328deg 360deg);box-shadow:inset -4px -5px 8px rgba(0,0,0,.32),inset 3px 3px 5px rgba(255,255,255,.7),0 2px 8px rgba(0,0,0,.35)}
    #wheel-of-doom:after{content:"";position:absolute;inset:0;border-radius:50%;background:linear-gradient(145deg,rgba(255,255,255,.42),transparent 38%,rgba(0,0,0,.12) 78%,rgba(255,255,255,.18));pointer-events:none}
    #wheel-of-doom:before{content:"";position:absolute;left:7px;top:4px;width:13px;height:7px;border-radius:50%;background:rgba(255,255,255,.62);filter:blur(1px);transform:rotate(-28deg);z-index:1}
    @media (hover:hover) and (pointer:fine){
      html,html *{cursor:none!important}
      #wheel-of-doom{display:block;animation:doom-spin .9s linear infinite}
      @keyframes doom-spin{from{transform:translate(-50%,-50%) rotate(0deg)}to{transform:translate(-50%,-50%) rotate(360deg)}}
    }
    @media (hover:none),(pointer:coarse){#wheel-of-doom{display:none!important}}
    @media(prefers-reduced-motion:reduce){#wheel-of-doom{animation:none!important}}
    @media(prefers-reduced-motion:no-preference){.code{animation:float 4s ease-in-out infinite}@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}}
  </style>
</head>
<body>
  <div id="wheel-of-doom" aria-hidden="true"></div>
  <main>
    <a href="/" aria-label="Olster Studios home" style="padding:0;display:inline-flex">
      <img class="logo" src="/images/logo.png" alt="Olster Studios logo">
    </a>
    <div class="code" aria-label="Error 404">404</div>
    <h1>Well, this is awkward.</h1>
    <p>We searched the whole website, checked behind the servers, and even asked the loading spinner. No luck. This page is officially playing hide-and-seek.</p>
    <div class="actions">
      <a class="home" href="/"><i class="fas fa-house"></i> Back to Home</a>
      <a class="blog" href="/blog/"><i class="fas fa-newspaper"></i> Visit the Blog</a>
    </div>
    <p class="hint">Error 404: page not found. Blame the pixels. 🤷</p>
  </main>
  <script>
    (() => {
      const wheel = document.getElementById('wheel-of-doom');
      const desktopPointer = window.matchMedia('(hover:hover) and (pointer:fine)');
      if (!wheel || !desktopPointer.matches) return;

      const moveWheel = (event) => {
        wheel.style.left = event.clientX + 'px';
        wheel.style.top = event.clientY + 'px';
      };

      // Listen for both pointer and mouse events for wider browser compatibility.
      window.addEventListener('pointermove', moveWheel, { passive: true });
      window.addEventListener('mousemove', moveWheel, { passive: true });
      window.addEventListener('blur', () => { wheel.style.visibility = 'hidden'; });
      window.addEventListener('focus', () => { wheel.style.visibility = 'visible'; });
    })();
  </script>
</body>
</html>
